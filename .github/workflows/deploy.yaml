
name: AWS Terraform Ansible HTML Hosting Demo

on:
  workflow_dispatch:

jobs:

  # JOB 1: AWS CONNECTION
  aws-connection:
    name: AWS Connection
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Check AWS Connection
        run: |
          aws sts get-caller-identity


  # JOB 2: TERRAFORM EC2 CREATION
  terraform-ec2:
    name: Terraform EC2 Kick Off
    runs-on: ubuntu-latest
    needs: aws-connection

    outputs:
      ec2_ip: ${{ steps.get-ip.outputs.ec2_ip }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get EC2 Public IP
        id: get-ip
        working-directory: terraform
        run: |
          EC2_IP=$(terraform output -raw instance_public_ip)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "EC2 Public IP: $EC2_IP"


  # JOB 3: ANSIBLE HTTPD INSTALLATION
  ansible-install:
    name: Ansible HTTPD Installation
    runs-on: ubuntu-latest
    needs: terraform-ec2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem

      - name: Create Ansible Inventory
        run: |
          echo "[webserver]" > inventory
          echo "${{ needs.terraform-ec2.outputs.ec2_ip }}" >> inventory
          echo "[webserver:vars]" >> inventory
          echo "ansible_user=ec2-user" >> inventory
          echo "ansible_ssh_private_key_file=$HOME/.ssh/ec2-key.pem" >> inventory

      - name: Disable Host Key Checking
        run: |
          echo "Host *" >> ~/.ssh/config
          echo "    StrictHostKeyChecking no" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test Ansible Connection
        run: |
          ANSIBLE_HOST_KEY_CHECKING=False ansible webserver -i inventory -m ping

      - name: Run Ansible Playbook
        run: |
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook \
          -i inventory ansible/install-httpd.yml


  # JOB 4: HTML PAGE DEPLOYMENT
  html-deployment:
    name: HTML Page Deployment
    runs-on: ubuntu-latest
    needs: [terraform-ec2, ansible-install]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem

      - name: Disable Host Key Checking
        run: |
          echo "Host *" >> ~/.ssh/config
          echo "    StrictHostKeyChecking no" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Copy HTML File to EC2
        run: |
          scp -i ~/.ssh/ec2-key.pem \
          index.html \
          ubuntu@${{ needs.terraform-ec2.outputs.ec2_ip }}:/tmp/index.html

      - name: Deploy HTML Page
        run: |
          ssh -i ~/.ssh/ec2-key.pem \
          ubuntu@${{ needs.terraform-ec2.outputs.ec2_ip }} \
          "sudo cp /tmp/index.html /var/www/html/index.html"

      - name: Deployment Successful
        run: |
          echo "HTML deployment completed!"
          echo "Website: http://${{ needs.terraform-ec2.outputs.ec2_ip }}"
