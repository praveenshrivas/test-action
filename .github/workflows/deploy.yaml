
name: AWS Terraform Ansible HTML Hosting Demo

on:
  workflow_dispatch:

jobs:

  # ==========================================
  # JOB 1 - AWS CONNECTION
  # ==========================================
  aws-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Check AWS Connection
        run: |
          aws sts get-caller-identity


  # ==========================================
  # JOB 2 - TERRAFORM EC2 CREATION
  # ==========================================
  terraform:
    needs: aws-connection
    runs-on: ubuntu-latest

    outputs:
      ec2_ip: ${{ steps.get_ip.outputs.ec2_ip }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get EC2 Public IP
        id: get_ip
        working-directory: terraform
        run: |
          EC2_IP=$(terraform output -raw instance_public_ip)
          echo "EC2 Public IP: $EC2_IP"
          echo "ec2_ip=$EC2_IP" >> "$GITHUB_OUTPUT"


  # ==========================================
  # JOB 3 - ANSIBLE HTTPD INSTALLATION
  # ==========================================
  ansible:
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Check Ansible Version
        run: |
          ansible --version

      - name: Create SSH Private Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 400 ~/.ssh/ec2-key.pem

      - name: Create Ansible Inventory
        run: |
          cat > inventory.ini <<EOF
          [webserver]
          ${{ needs.terraform.outputs.ec2_ip }} ansible_user=ec2-user ansible_ssh_private_key_file=$HOME/.ssh/ec2-key.pem
          EOF

      - name: Disable SSH Host Key Checking
        run: |
          echo "ANSIBLE_HOST_KEY_CHECKING=False" >> "$GITHUB_ENV"

      - name: Show Inventory
        run: |
          cat inventory.ini

      - name: Wait for EC2 SSH
        run: |
          EC2_IP="${{ needs.terraform.outputs.ec2_ip }}"

          for i in {1..30}; do
            if ssh -i ~/.ssh/ec2-key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              -o BatchMode=yes \
              ec2-user@$EC2_IP "echo SSH Connected"; then
              echo "EC2 SSH is ready!"
              exit 0
            fi

            echo "Waiting for EC2... Attempt $i"
            sleep 10
          done

          echo "EC2 SSH connection failed!"
          exit 1

      - name: Test Ansible Connection
        run: |
          ansible webserver -i inventory.ini -m ping -T 10

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i inventory.ini ansible/install-httpd.yml


  # ==========================================
  # JOB 4 - HTML PAGE DEPLOYMENT
  # ==========================================
  html-deployment:
    needs: [terraform, ansible]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create SSH Private Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 400 ~/.ssh/ec2-key.pem

      - name: Disable SSH Host Key Checking
        run: |
          echo "Host *" >> ~/.ssh/config
          echo "    StrictHostKeyChecking no" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Check EC2 IP
        run: |
          EC2_IP="${{ needs.terraform.outputs.ec2_ip }}"
          echo "EC2 Public IP: $EC2_IP"

          if [ -z "$EC2_IP" ]; then
            echo "EC2 IP is empty!"
            exit 1
          fi

      - name: Copy HTML File to EC2
        run: |
          EC2_IP="${{ needs.terraform.outputs.ec2_ip }}"

          scp -i ~/.ssh/ec2-key.pem \
            index.html \
            ec2-user@$EC2_IP:/tmp/index.html

      - name: Deploy HTML Page
        run: |
          EC2_IP="${{ needs.terraform.outputs.ec2_ip }}"

          ssh -i ~/.ssh/ec2-key.pem \
            ec2-user@$EC2_IP \
            "sudo cp /tmp/index.html /var/www/html/index.html"

      - name: Verify Website
        run: |
          EC2_IP="${{ needs.terraform.outputs.ec2_ip }}"

          curl -f http://$EC2_IP

          echo "HTML deployment completed successfully!"
          echo "Website: http://$EC2_IP"
